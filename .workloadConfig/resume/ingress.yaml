---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume
  labels:
    app.kubernetes.io/name: hugo
    app.kubernetes.io/component: webfront
    app.kubernetes.io/part-of: resume
    #+operator-builder:collection:field:name="profile.firstName",type=string,default="John",replace="john"
    #+operator-builder:collection:field:name="profile.lastName",type=string,default="Doe",replace="doe"
    app.kubernetes.io/instance: resume-johndoe
    app.kubernetes.io/managed-by: resume-operator
    app.kubernetes.io/created-by: resume-controller-manager
    #+operator-builder:collection:field:name="web.image.tag",type=string,default="latest"
    app.kubernetes.io/version: latest
  # NOTE: Ingress class, annotations (incl. the cert-manager issuer), and labels
  # are now configured through spec.ingress on the Profile, a structured block
  # that operator-builder scalar markers cannot express. The Go resource
  # generator apis/.../resume/resume_ingress.go is the source of truth, and an
  # alternative Gateway API route is produced by resume_route.go (spec.route).
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        #+operator-builder:field:name=baseURL,type=string,default="example.com"
        - example.com
      secretName: resume-tls
  rules:
    - #+operator-builder:field:name=baseURL,type=string,default="example.com"
      host: example.com
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: resume-svc
                port:
                  number: 8080
          - pathType: Prefix
            path: /convert
            backend:
              service:
                name: pdf-converter-svc
                port:
                  number: 3000
