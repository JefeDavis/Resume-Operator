---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: profiles.resumes.jefedavis.dev
spec:
  group: resumes.jefedavis.dev
  names:
    kind: Profile
    listKind: ProfileList
    plural: profiles
    singular: profile
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Profile is the Schema for the profiles API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ProfileSpec defines the desired state of Profile.
            properties:
              baseURL:
                default: example.com
                description: '(Default: "example.com")'
                type: string
              ingress:
                description: |-
                  Ingress configures an Ingress for the resume site. It is used when Route
                  is not set. When omitted, a default nginx Ingress is created.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      Annotations are added to the Ingress metadata. Supply controller-specific
