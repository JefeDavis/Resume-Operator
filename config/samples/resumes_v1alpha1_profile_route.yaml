apiVersion: resumes.jefedavis.dev/v1alpha1
kind: Profile
metadata:
  name: profile-sample-route
  namespace: default
spec:
  profile:
    firstName: "John"
    lastName: "Doe"
    phoneNumber: ""
    email: ""
    linkedinURL: ""
    githubURL: ""
    location: "South Carolina"
    overview: ""
    coreCompetencies:
      - Reading
      - Writing
    projects:
      - https://github.com/JefeDavis/resume-operator
    skills:
      - family: Developer Tools
        items:
          - Git
          - Kubernetes
  web:
    image:
      tag: "latest"
      registry: "ghcr.io/"
      name: "jefedavis/resume"
      pullPolicy: "IfNotPresent"
  baseURL: "example.com"
  pageTitle: "John Doe - CV"
  pageCount: "1"
  pdf:
    image:
      registry: "ghcr.io/"
      name: "jefedavis/resume-pdf-converter"
      tag: "latest"
      pullPolicy: "IfNotPresent"
  podLabels:
    example.com/team: platform
  podAnnotations:
    example.com/scrape: "true"
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # Gateway API route instead of an Ingress. Requires the Gateway API CRDs and a
  # Gateway to be installed in the cluster. When "route" is set, no Ingress is
  # created.
  route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    hostname: example.com
    labels:
      app.kubernetes.io/exposure: gateway
    annotations:
      example.com/owner: platform
    parentRefs:
      - name: public-gateway
        namespace: gateway-system
        sectionName: https
